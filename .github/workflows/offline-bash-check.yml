name: Bash learning safety and integrity
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bash-foundations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run local-only safety and checksum checks
        run: bash tests/smoke.sh
